{% assign theme = site.data.colors %}

<div id="overlay" 
  class="fixed top-0 left-0 size-full bg-black opacity-50 z-40 hidden transition-opacity duration-300 ease-in-out">
</div>
<div id="sidebar"
  class="
    fixed
    top-0
    left-0
    h-full
    -translate-x-full
    transform
    transition-transform
    duration-300
    ease-in-out
    z-50
    border-r
    border-zinc-700
    dark:border-gray-400
    lg:static
    lg:block
    lg:min-w-[300px]
    lg:max-w-[300px]
    lg:-translate-x-0
    {{ theme.background-secondary }}
    p-8">
  <div class="text-center mb-4">
    <a class="text-4xl font-bold {{ theme.header-link }}" href="{{ site.baseurl }}/">{{ site.title }}</a>
  </div>

  <div class="flex justify-center mb-4">
    <a href="{{ site.baseurl }}/about">
      <img src="{{ site.title_image }}"
        class="rounded-full hover:border-sky-500 transition duration-300 delay-100 {{ theme.border }}"
        height="150"
        width="150"
        alt="{{ site.title }}" />
    </a>
  </div>

  {% include social_links.html %}

  <h1 class="{{ theme.text-secondary }} text-center italic mb-4">{{ site.description }}</h1>

  <ul class="text-lg px-4">
    {% for pg in site.data.pages %}
    <li class="{{ theme.sidebar-link }}">
      <a class="flex gap-x-2 py-2 px-4 justify-center items-center" href="{{ site.baseurl }}{{ pg.link }}">
        <i class="flex-1 fa-solid {{ pg.icon }} fa-fw mr-2"></i>
        <span class="flex-3">
          {{ pg.name | upcase }}
        </span>
      </a>
    </li>
    {% endfor %}
  </ul>
</div>
