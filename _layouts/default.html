{% assign theme = site.data.colors %}
<!DOCTYPE html>
<html class="size-full">

  {% include head.html %}

  <body class="size-full flex dark:selection:bg-gray-400/20 {{ theme.background-primary }} {{ theme.text-primary }}">

    <div class="flex flex-col grow max-h-screen overflow-auto">
      <header class="flex-1">{% include header.html %}</header>

      <footer class="flex-1">{% include footer.html %}</footer>
    </div>

  </body>

</html>
